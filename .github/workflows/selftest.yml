name: selftest
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        include:
          - os: ubuntu-latest
            node: 18
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Self-test
        shell: bash
        env:
          LAUNCHCODES_FULL: '1'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # Run everything with the built-in /bin/bash 3.2, the bash a stock Mac uses.
            mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
            export PATH="$RUNNER_TEMP/bash32:$PATH"
          fi
          bash --version | head -1; git --version; node --version; npm --version; uname -a
          bash tests/selftest.sh
